server:
  port: 9041
spring:
  application:
    name: { appName }
  kafka:
    enabled: true
    bootstrap-servers:
      - localhost:19092
      - localhost:9092
    client-id: my-app-client
    default-topic: my-default-topic

    consumer:
      group-id: my-app-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      max-poll-interval-ms: 300000
      session-timeout-ms: 10000
      isolation-level: read_committed

    producer:
      acks: all
      retries: 5
      batch-size: 16384
      buffer-memory: 33554432
      compression-type: gzip
      linger-ms: 5
  data:
    redis:
      enabled: true
      host: redis.production.example.com
      port: 6379
      password: yourStrongRedisPassword
      ssl:
        enabled: false
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 1000ms
      client-type: lettuce


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true

metrics:
  prometheus:
    enabled: true