name: Maven CI/CD & Semantic Release

on:
  push:
    branches:
      - develop

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Configure Git for tagging
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      # 3️⃣ Get latest tag or fallback to initial
      - name: Get latest tag
        id: get_tag
        run: |
          if git describe --tags $(git rev-list --tags --max-count=1) >/dev/null 2>&1; then
            LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          else
            LATEST_TAG="v0.0.0"
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "LATEST_VERSION=${LATEST_TAG#v}" >> $GITHUB_ENV

      # 4️⃣ Determine version bump safely
      - name: Determine bump type
        id: bump
        run: |
          BUMP="patch"
          if git rev-parse ${{ env.LATEST_TAG }} >/dev/null 2>&1; then
            COMMITS=$(git log ${{ env.LATEST_TAG }}..HEAD --pretty=format:%s)
          else
            COMMITS=$(git log --pretty=format:%s)
          fi
          echo "Commits since last tag:"; echo "$COMMITS"
          if echo "$COMMITS" | grep -iq "\[major\]"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -iq "\[minor\]"; then
            BUMP="minor"
          fi
          echo "BUMP=$BUMP" >> $GITHUB_ENV

      # 5️⃣ Calculate new version
      - name: Increment version
        id: inc_version
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ env.LATEST_VERSION }}"
          case "${{ env.BUMP }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      # 6️⃣ Create and push tag
      - name: Create Git tag
        run: |
          git tag ${{ env.NEW_TAG }}
          git push origin ${{ env.NEW_TAG }}

      # 7️⃣ Setup Java for Maven build
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      # 8️⃣ Configure Maven for GitHub Packages
      - name: Configure Maven
        run: |
          mkdir -p $HOME/.m2
          echo "<settings>
                  <servers>
                    <server>
                      <id>github</id>
                      <username>${{ github.actor }}</username>
                      <password>${{ secrets.GITHUB_TOKEN }}</password>
                    </server>
                  </servers>
                </settings>" > $HOME/.m2/settings.xml

      # 9️⃣ Update Maven version
      - name: Update Maven version
        run: mvn versions:set -DnewVersion=${{ env.NEW_VERSION }}

      # 🔟 Build and deploy library
      - name: Build and Deploy
        run: mvn clean deploy -DskipTests
